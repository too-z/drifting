logging:
  project: "drift-tabular"

dataset:
  type: tabular
  name: indian_liver
  num_classes: 2
  batch_size: 128
  eval_batch_size: 64
  kwargs:
    csv_path: "data/real-world/indian_liver_patient/indian_liver_patient_prep.csv"
    target_col: "Label"
    drop_cols: ["Domain"]
    categorical_cols: ["Gender"]
    cont_transform: "quantile"  # zscore | quantile (rank-gauss); quantile removes the heavy-tail skew
    cat_smooth: 0.01 # dequantization
    val_frac: 0.1
    seed: 42
    num_workers: 0
    pin_memory: false

model:
  tabular: true
  cond_dim: 128
  input_size: 10
  in_channels: 1
  out_channels: 1
  
  hidden_size: 128 
  depth: 6
  num_heads: 4
  mlp_ratio: 4.0
  
  use_qknorm: true
  use_swiglu: true
  use_rope: false
  use_rmsnorm: true
  n_cls_tokens: 8
  noise_classes: 64
  noise_coords: 32
  cat_softmax: true
  use_bf16: false   # tabular runs on CPU in fp32; bf16 saves no memory here
  attn_fp32: false  # inert once bf16 is off (attention is already fp32)
  use_remat: false  # gradient checkpointing — unneeded for this tiny model

optimizer:
  lr_schedule:
    learning_rate: 0.0002
    warmup_steps: 200
    lr_schedule: "cosine"  # anneal LR to ~0 for a sharper final model (was "const")
    total_steps: 4000      # matches train.total_steps so cosine decays over the real horizon
  weight_decay: 0.01
  adam_b1: 0.9
  adam_b2: 0.95

train:
  train_batch_size: 64
  seed: 42
  total_steps: 4000
  save_per_step: 1000
  keep_every: 100000
  keep_last: 2
  eval_per_step: 500        # drives the tabular eval hook (FID eval is off for tabular)
  tabular_eval:
    enabled: true
    n_samples: 1000
    cfg_scale: 1.0
    c2st_repeats: 1         # 1 repeat x 5 folds keeps the in-training hook cheap
    c2st_clf: "gb"          # gb (strong critic) | logreg (the weak critic TabSyn/TabDiff use)
    decode_clip: true       # decode exactly as run.generate_tabular does, otherwise the
    decode_round: true      # discretization artifact dominates C2ST and hides real progress
    include_target: true    # the label counts as one more column, as in every baseline paper
    quality: true           # alpha-Precision / beta-Recall / Authenticity / Density / Coverage
    privacy: true           # DCR. NOTE: dcr_share needs val_frac~0.5 to be sharp; at 0.1 it is
    density_k: 5            # diluted toward 0.5 — read dcr_ratio_p5 / dcr_zero_frac instead
    dcr_repeats: 5
  pos_per_sample: 32
  neg_per_sample: 16
  positive_bank_size: 128
  negative_bank_size: 512
  forward_dict:
    gen_per_label: 16
    cfg_min: 1.0
    cfg_max: 4.0
    neg_cfg_pw: 1.0
  activation_kwargs:
    use_std: false
    use_mean: false
  loss_kwargs:
    R_list: [0.2, 0.05, 0.02]
  ema_decay: 0.999
  push_per_step: 64

feature:
  use_mae: false
  use_convnext: false
